<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Deep Defense Emerald Shield Gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#144d29"/>
      <stop offset="45%" stop-color="#0e381d"/>
      <stop offset="100%" stop-color="#061c0e"/>
    </linearGradient>

    <!-- Rich Indian Defense Gold Gradient -->
    <linearGradient id="goldLuster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a8"/>
      <stop offset="25%" stop-color="#ffd24d"/>
      <stop offset="60%" stop-color="#e6ad1c"/>
      <stop offset="100%" stop-color="#a67508"/>
    </linearGradient>

    <!-- Shiny Gold Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c48f17"/>
      <stop offset="50%" stop-color="#fff5b8"/>
      <stop offset="100%" stop-color="#c48f17"/>
    </linearGradient>

    <!-- Indian Tricolor (Tiranga) Gradients -->
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#ff9933"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#138808"/>
      <stop offset="100%" stop-color="#0d6105"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="defenseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- 1. Outer Crest Shield Base -->
  <path d="M60 8 C88 8, 108 18, 108 38 C108 72, 84 98, 60 112 C36 98, 12 72, 12 38 C12 18, 32 8, 60 8 Z" 
        fill="url(#shieldBg)" 
        stroke="url(#goldRim)" 
        stroke-width="4.5"
        stroke-linejoin="round"
        filter="url(#defenseGlow)"/>

  <!-- 2. Inner Golden Inset Shield Border -->
  <path d="M60 16 C82 16, 99 24, 99 41 C99 68, 79 91, 60 102 C41 91, 21 68, 21 41 C21 24, 38 16, 60 16 Z" 
        fill="none" 
        stroke="url(#goldLuster)" 
        stroke-width="1.8" 
        stroke-opacity="0.85"
        stroke-dasharray="none"/>

  <!-- 3. Indian Tiranga Ribbon / Sash at Upper Section -->
  <g>
    <!-- Saffron Upper Band -->
    <path d="M25 32 Q60 40 95 32 L96 37 Q60 45 24 37 Z" fill="url(#saffronGrad)"/>
    <!-- White Middle Band -->
    <path d="M24 37 Q60 45 96 37 L97 42 Q60 50 23 42 Z" fill="#ffffff"/>
    <!-- Navy Ashoka Chakra Dot -->
    <circle cx="60" cy="44" r="2.8" fill="#000088"/>
    <circle cx="60" cy="44" r="1.2" fill="#ffffff"/>
    <!-- Green Lower Band -->
    <path d="M23 42 Q60 50 97 42 L98 47 Q60 55 22 47 Z" fill="url(#greenGrad)"/>
  </g>

  <!-- 4. Crossed Indian Army Sabres / Cavalry Swords -->
  <g stroke="url(#goldLuster)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Sabre 1 (Bottom Left to Top Right) -->
    <!-- Blade -->
    <line x1="32" y1="90" x2="88" y2="40" stroke-width="3.5"/>
    <line x1="33" y1="89" x2="87" y2="41" stroke="#ffffff" stroke-width="1.2"/>
    <!-- Crossguard -->
    <line x1="28" y1="84" x2="40" y2="92" stroke-width="4"/>
    <!-- Pommel / Hilt -->
    <circle cx="28" cy="93" r="3.2" fill="url(#goldLuster)" stroke="none"/>

    <!-- Sabre 2 (Bottom Right to Top Left) -->
    <!-- Blade -->
    <line x1="88" y1="90" x2="32" y2="40" stroke-width="3.5"/>
    <line x1="87" y1="89" x2="33" y2="41" stroke="#ffffff" stroke-width="1.2"/>
    <!-- Crossguard -->
    <line x1="92" y1="84" x2="80" y2="92" stroke-width="4"/>
    <!-- Pommel / Hilt -->
    <circle cx="92" cy="93" r="3.2" fill="url(#goldLuster)" stroke="none"/>
  </g>

  <!-- 5. Central Golden Defense Emblem (Ashoka Lion Capital Crown & Star) -->
  <!-- Center Medallion Ring -->
  <circle cx="60" cy="65" r="16" fill="#0b2b16" stroke="url(#goldLuster)" stroke-width="2.5"/>
  <circle cx="60" cy="65" r="12" fill="none" stroke="url(#goldLuster)" stroke-width="1" stroke-dasharray="2 1.5"/>

  <!-- 5-Point Defense Star inside Center Medallion -->
  <polygon points="60,54 63.8,61.8 72.4,63 66.2,69 67.7,77.6 60,73.5 52.3,77.6 53.8,69 47.6,63 56.2,61.8" 
           fill="url(#goldLuster)" 
           stroke="#a67508" 
           stroke-width="0.7"/>

  <!-- Center Core Jewel -->
  <circle cx="60" cy="65" r="3" fill="#ffffff" stroke="#c48f17" stroke-width="1"/>

  <!-- 6. Top Golden Crest Crown / Stars -->
  <g fill="url(#goldLuster)">
    <!-- Central Top Star -->
    <polygon points="60,18 61.8,22.2 66.2,22.8 63,26 63.8,30.4 60,28.2 56.2,30.4 57,26 53.8,22.8 58.2,22.2"/>
    <!-- Flanking Left Star -->
    <polygon points="46,22 47.3,25.2 50.8,25.7 48.2,28.2 48.8,31.7 46,30 43.2,31.7 43.8,28.2 41.2,25.7 44.7,25.2"/>
    <!-- Flanking Right Star -->
    <polygon points="74,22 75.3,25.2 78.8,25.7 76.2,28.2 76.8,31.7 74,30 71.2,31.7 71.8,28.2 69.2,25.7 72.7,25.2"/>
  </g>
</svg>
